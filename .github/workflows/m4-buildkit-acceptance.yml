name: M4 rootless BuildKit acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkit-acceptance:
    # GitHub provisions a fresh VM for every ubuntu-24.04 job in this public
    # repository. The job provisions only its disposable rootless toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted runner security baseline
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          [[ "${ID:-}" == ubuntu && "${VERSION_ID:-}" == 24.04 ]] || {
            echo "M4 requires Ubuntu 24.04; got ${ID:-unknown} ${VERSION_ID:-unknown}" >&2
            exit 1
          }
          sudo -n true
          userns_policy="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          echo "kernel.apparmor_restrict_unprivileged_userns=${userns_policy:-unavailable}"
          [[ "$userns_policy" == 1 ]] || {
            echo 'M4 blocker: hosted runner does not expose the expected AppArmor userns policy (1)' >&2
            exit 1
          }
          command -v aa-status >/dev/null || {
            echo 'M4 blocker: aa-status is unavailable on the hosted image' >&2
            exit 1
          }
          sudo aa-status --enabled || {
            echo 'M4 blocker: AppArmor is not enabled on the hosted image' >&2
            exit 1
          }
          df -h /

      - name: Provision rootless BuildKit prerequisites
        run: sudo ./scripts/m4-runner/provision-ubuntu.sh

      - name: Install pinned BuildKit and registry binaries
        shell: bash
        run: |
          set -euo pipefail
          source infrastructure/m4-runner/versions.env
          sudo env \
            BUILDKIT_VERSION="$BUILDKIT_VERSION" \
            BUILDKIT_ARCH="$BUILDKIT_ARCH" \
            BUILDKIT_TARBALL_SHA256="$BUILDKIT_TARBALL_SHA256" \
            ./scripts/m4-runner/install-buildkit-binaries.sh
          sudo env \
            REGISTRY_TARBALL_URL="$REGISTRY_TARBALL_URL" \
            REGISTRY_TARBALL_SHA256="$REGISTRY_TARBALL_SHA256" \
            ./scripts/m4-runner/install-registry-binary.sh

      - name: Verify rootless prerequisites and packaged AppArmor profile
        run: sudo ./scripts/m4-runner/check-prerequisites.sh --profile-test

      - name: Stage rootless runtime config
        shell: bash
        run: |
          set -euo pipefail
          sudo env BUILDKIT_CLIENT_GROUP="$(id -gn)" \
            ./scripts/m4-runner/stage-rootless-runtime-config.sh

      - name: Start rootless BuildKit and registry
        run: sudo -u previewforge-buildkit ./scripts/m4-runner/start-rootless-stack.sh

      - name: Verify RootlessKit child namespace and UID/GID maps
        run: sudo ./scripts/m4-runner/verify-rootless-namespace.sh

      - name: Verify loopback registry readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5000/v2/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'M4 blocker: rootless loopback registry did not become ready' >&2
          sudo -u previewforge-buildkit cat /var/tmp/previewforge-buildkit/rootless-stack.log || true
          exit 1

      - name: Verify BuildKit Unix socket
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if [[ -S /var/tmp/previewforge-buildkit/buildkitd.sock ]]; then
              exit 0
            fi
            sleep 1
          done
          echo 'M4 blocker: BuildKit Unix socket did not become ready' >&2
          sudo -u previewforge-buildkit cat /var/tmp/previewforge-buildkit/rootless-stack.log || true
          exit 1

      - name: Authorize normal BuildKit client
        shell: bash
        run: |
          set -euo pipefail
          sudo env BUILDKIT_CLIENT_GROUP="$(id -gn)" \
            ./scripts/m4-runner/authorize-buildkit-client.sh

      - name: Verify BuildKit workers
        run: |
          buildctl \
            --addr unix:///var/tmp/previewforge-buildkit/buildkitd.sock \
            debug workers

      - name: Diagnose rootless startup failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '--- kernel AppArmor/rootlesskit records (journalctl) ---'
          sudo journalctl -k --no-pager 2>&1 \
            | grep -Ei 'apparmor="DENIED"|rootlesskit' \
            | tail -200 || true
          echo '--- kernel AppArmor/rootlesskit records (dmesg) ---'
          sudo dmesg --color=never 2>&1 \
            | grep -Ei 'apparmor="DENIED"|rootlesskit' \
            | tail -200 || true
          echo '--- rootless stack log ---'
          sudo -u previewforge-buildkit cat /var/tmp/previewforge-buildkit/rootless-stack.log || true
          echo '--- rootless process state ---'
          sudo ps -eo pid,user,stat,args | grep -E 'rootlesskit|buildkitd|registry' | grep -v grep || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL and Kafka test dependencies
        run: pnpm infra:up
      - name: Generate Prisma Client
        run: pnpm generate
        env:
          # Prisma 7 loads prisma.config.ts during generation; no connection is opened.
          DATABASE_URL: postgresql://previewforge:previewforge@localhost:55432/previewforge
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @previewforge/database migrate:deploy
        env:
          DATABASE_URL: postgresql://previewforge:previewforge@localhost:55432/previewforge
      - name: Build database package
        run: pnpm --filter @previewforge/contracts build && pnpm --filter @previewforge/database build

      - name: Build fixture, push registry, and verify immutable digest
        shell: bash
        env:
          BUILDKIT_ADDR: unix:///var/tmp/previewforge-buildkit/buildkitd.sock
          DATABASE_URL: postgresql://previewforge:previewforge@localhost:55432/previewforge
          REGISTRY_URL: 127.0.0.1:5000
          REGISTRY_PROTOCOL: http
        run: |
          set -euo pipefail
          pnpm test:acceptance:build

      - name: Cleanup rootless BuildKit and registry
        if: always()
        shell: bash
        run: |
          set +e
          if id previewforge-buildkit >/dev/null 2>&1; then
            sudo -u previewforge-buildkit ./scripts/m4-runner/stop-rootless-stack.sh
          fi
          pnpm infra:down || true
          sudo rm -rf /var/tmp/previewforge-buildkit /var/tmp/previewforge-registry
