name: M4 rootless BuildKit acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkit-acceptance:
    # This label must point to an ephemeral Ubuntu runner provisioned according
    # to docs/infrastructure/m4-rootless-buildkit.md. It must not be a broad
    # shared or privileged runner.
    runs-on: [self-hosted, previewforge-rootless]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run real BuildKit and registry acceptance
        env:
          BUILDKIT_ADDR: ${{ vars.PREVIEWFORGE_BUILDKIT_ADDR }}
          REGISTRY_URL: ${{ vars.PREVIEWFORGE_REGISTRY_URL }}
          REGISTRY_PROTOCOL: ${{ vars.PREVIEWFORGE_REGISTRY_PROTOCOL || 'https' }}
        run: pnpm test:acceptance:build
