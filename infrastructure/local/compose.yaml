name: previewforge

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: previewforge
      POSTGRES_PASSWORD: previewforge
      POSTGRES_USER: previewforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previewforge -d previewforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below /var/lib/postgresql.
      # Mount the parent path so container recreation preserves PGDATA.
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "59092:9092"

  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "55000:5000"
    volumes:
      - registry-data:/var/lib/registry

volumes:
  postgres-data:
  registry-data:
