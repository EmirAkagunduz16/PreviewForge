name: previewforge

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: previewforge
      POSTGRES_PASSWORD: previewforge
      POSTGRES_USER: previewforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previewforge -d previewforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${PREVIEWFORGE_POSTGRES_LOCAL_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below /var/lib/postgresql.
      # Mount the parent path so container recreation preserves PGDATA.
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${PREVIEWFORGE_KAFKA_LOCAL_PORT:-59092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "${PREVIEWFORGE_KAFKA_LOCAL_PORT:-59092}:9092"

  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${PREVIEWFORGE_REGISTRY_LOCAL_PORT:-55000}:5000"
    volumes:
      - registry-data:/var/lib/registry

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "59090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    # The upstream image runs as UID 10001, while a fresh named volume is
    # root-owned. This local-only service needs the volume bootstrap to be
    # writable; PreviewForge workloads never inherit this container identity.
    user: "0:0"
    ports:
      - "53200:3200"
      - "14317:4317"
      - "14320:4318"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [observability]
    depends_on:
      - tempo
    ports:
      - "14318:4318"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    depends_on:
      - prometheus
      - tempo
    ports:
      - "53000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  registry-data:
  prometheus-data:
  tempo-data:
  grafana-data:
